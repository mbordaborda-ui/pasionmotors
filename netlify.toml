[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify debe tener configuradas estas variables de entorno:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Sin ellas la tienda usa el catálogo local de respaldo y no podrá procesar
# pagos, cuentas ni pedidos reales.

# ---------------------------------------------------------------------------
# Cabeceras de seguridad
# ---------------------------------------------------------------------------
# Se aplican a todas las respuestas del sitio. La política de contenido (CSP)
# permite únicamente los orígenes que la tienda necesita: el propio sitio,
# Supabase (API + tiempo real), Google Fonts y Mercado Pago (formulario de pago).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mercadopago.com; frame-src 'self' https://www.mercadopago.com https://mercadopago.com; form-action 'self' https://www.mercadopago.com https://mercadopago.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# El service worker debe revalidarse para recibir actualizaciones de la app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Archivos con hash en el nombre: si cambian, cambia la URL. Se pueden cachear
# para siempre y así las visitas siguientes cargan casi al instante.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
